<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شحن جواهر فري فاير - الرسمي</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #ff5500;
            --accent-hover: #ff7733;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success-color: #10b981;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط التنقل العلوي */
        header {
            background-color: rgba(19, 27, 46, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .user-balance-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
        }

        .user-balance-box span {
            color: var(--success-color);
        }

        /* المحتوى الرئيسي */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* إدخال الآيدي */
        .id-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .id-card label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .id-input-group {
            display: flex;
            gap: 15px;
        }

        .id-input-group input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .id-input-group input:focus {
            border-color: var(--accent-color);
        }

        /* شبكة باقات الجواهر */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .package-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .package-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .package-card.selected {
            border-color: var(--accent-color);
            background: linear-gradient(135deg, rgba(255, 85, 0, 0.1), var(--card-bg));
            box-shadow: 0 0 20px rgba(255, 85, 0, 0.2);
        }

        .gem-icon {
            width: 50px;
            height: 50px;
            margin: 0 auto 15px;
            background: radial-gradient(circle, #ff7733 0%, #cc3300 100%);
            clip-path: polygon(50% 0%, 100% 25%, 80% 100%, 20% 100%, 0% 25%);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.5);
        }

        .gem-amount {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .gem-price {
            font-size: 15px;
            color: var(--text-muted);
        }

        /* زر الشحن */
        .recharge-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 85, 0, 0.4);
        }

        .recharge-btn:hover {
            background-color: var(--accent-hover);
        }

        .recharge-btn:active {
            transform: scale(0.98);
        }

        /* النوافذ التفاعلية (Modals) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: modalScale 0.3s ease;
        }

        @keyframes modalScale {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* دائرة التحميل */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* نافذة النجاح */
        .success-icon {
            width: 60px;
            height: 60px;
            background-color: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
            color: #fff;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .close-modal-btn {
            margin-top: 20px;
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .close-modal-btn:hover {
            background-color: #2e3b52;
        }
    </style>
</head>
<body>

    <!-- شريط العلوي -->
    <header>
        <div class="logo">Garena FF Store</div>
        <div class="user-balance-box">
            رصيدك: <span id="userBalance">15,000 دج</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        
        <!-- حقل الآيدي -->
        <div class="id-card">
            <label for="playerId">معرف اللاعب (Player ID)</label>
            <div class="id-input-group">
                <input type="text" id="playerId" placeholder="أدخل آيدي الحساب هنا (مثال: 849201948)">
            </div>
        </div>

        <div class="section-title">اختر باقة الجواهر</div>

        <!-- شبكة الباقات -->
        <div class="packages-grid">
            <div class="package-card" onclick="selectPackage(this, 100, 1200)">
                <div class="gem-icon"></div>
                <div class="gem-amount">100 جوهرة</div>
                <div class="gem-price">1,200 دج</div>
            </div>

            <div class="package-card selected" onclick="selectPackage(this, 310, 3500)">
                <div class="gem-icon"></div>
                <div class="gem-amount">310 جوهرة</div>
                <div class="gem-price">3,500 دج</div>
            </div>

            <div class="package-card" onclick="selectPackage(this, 520, 5800)">
                <div class="gem-icon"></div>
                <div class="gem-amount">520 جوهرة</div>
                <div class="gem-price">5,800 دج</div>
            </div>

            <div class="package-card" onclick="selectPackage(this, 1060, 11500)">
                <div class="gem-icon"></div>
                <div class="gem-amount">1,060 جوهرة</div>
                <div class="gem-price">11,500 دج</div>
            </div>
        </div>

        <!-- زر تنفيذ الشحن -->
        <button class="recharge-btn" onclick="startRecharge()">شحن الآن</button>
    </div>

    <!-- نافذة الانتظار -->
    <div class="modal-overlay" id="loadingModal">
        <div class="modal-box">
            <div class="spinner"></div>
            <div class="modal-title">يرجى الانتظار من فضلك</div>
            <div class="modal-desc">جاري معالجة الطلب والاتصال بسيرفر اللعبة...</div>
        </div>
    </div>

    <!-- نافذة النجاح -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="success-icon">&#10003;</div>
            <div class="modal-title">تم الشحن بنجاح</div>
            <div class="modal-desc" id="successDesc">تم إرسال الجواهر إلى الحساب المحدد بنجاح.</div>
            <button class="close-modal-btn" onclick="closeSuccessModal()">إغلاق</button>
        </div>
    </div>

    <script>
        // إعدادات الرصيد والبيانات الافتراضية
        let currentBalance = 15000; // الرصيد الابتدائي بالدينار
        let selectedAmount = 310;
        let selectedPrice = 3500;

        // دالة اختيار الباقة
        function selectPackage(element, amount, price) {
            // إزالة التحديد عن كل الباقات
            document.querySelectorAll('.package-card').forEach(card => {
                card.classList.remove('selected');
            });
            // إضافة التحديد للباقة المختارة
            element.classList.add('selected');
            selectedAmount = amount;
            selectedPrice = price;
        }

        // دالة بدء عملية الشحن الواقعية
        function startRecharge() {
            const playerId = document.getElementById('playerId').value.trim();

            // التحقق من إدخال الآيدي
            if(playerId === "") {
                alert("الرجاء إدخال معرف اللاعب (Player ID) بشكل صحيح");
                return;
            }

            // التحقق من كفاية الرصيد
            if(currentBalance < selectedPrice) {
                alert("عذراً، رصيدك الحالي غير كافٍ لإتمام عملية الشحن!");
                return;
            }

            // إظهار نافذة الانتظار
            const loadingModal = document.getElementById('loadingModal');
            loadingModal.style.display = 'flex';

            // محاكاة الاتصال بالسيرفر لمدة 3 ثوانٍ
            setTimeout(() => {
                // إخفاء نافذة الانتظار
                loadingModal.style.display = 'none';

                // خصم المبلغ من الرصيد الحقيقي وتحديث واجهة المستخدم
                currentBalance -= selectedPrice;
                document.getElementById('userBalance').textContent = currentBalance.toLocaleString() + " دج";

                // تحديث نص رسالة النجاح
                document.getElementById('successDesc').textContent = `تم إضافة ${selectedAmount} جوهرة إلى الحساب (ID: ${playerId}) بنجاح.`;

                // إظهار نافذة النجاح
                document.getElementById('successModal').style.display = 'flex';

            }, 3000); // 3 ثواني وهمية للواقعية
        }

        // إغلاق نافذة النجاح
        function closeSuccessModal() {
            document.getElementById('successModal').style.display = 'none';
        }
    </script>
</body>
</html>
