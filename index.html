<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire - Official Top Up</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --bg-card: #0f172a;
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --accent: #ff007f;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --success: #10b981;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, #111e38 0%, var(--bg-dark) 70%);
        }

        /* رأس الصفحة */
        header {
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .brand span {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .balance-container {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border);
            padding: 10px 22px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .balance-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .balance-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--success);
        }

        /* المحتوى */
        .wrapper {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .card-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .input-wrapper input {
            width: 100%;
            background-color: #07090e;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            color: #fff;
            font-size: 17px;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .section-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        /* شبكة الباقات */
        .grid-packages {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .pkg-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .pkg-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
        }

        .pkg-card.active {
            border-color: var(--primary);
            background: linear-gradient(145deg, rgba(0, 210, 255, 0.08), var(--bg-card));
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
        }

        /* تصميم الألماسة الحقيقية 3D بالـ SVG */
        .diamond-graphic {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.6));
            animation: floatDiamond 3s ease-in-out infinite;
        }

        @keyframes floatDiamond {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .pkg-amount {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
        }

        .pkg-price {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* زر الشحن */
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.4);
            letter-spacing: 0.5px;
        }

        .action-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 114, 255, 0.6);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* النوافذ المنبثقة */
        .modal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal-header-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-sub-text {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .success-badge {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        .close-popup {
            margin-top: 25px;
            background-color: var(--border);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s;
        }

        .close-popup:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <!-- شريط الرصيد العلوي الحقيقي -->
    <header>
        <div class="brand">
            Garena <span>FF Center</span>
        </div>
        <div class="balance-container">
            <span class="balance-label">الرصيد المتاح:</span>
            <span id="userBalance" class="balance-value">12,500 دج</span>
        </div>
    </header>

    <div class="wrapper">
        <!-- إدخال الآيدي -->
        <div class="card-box">
            <div class="card-title">معرف اللاعب (Player ID)</div>
            <div class="input-wrapper">
                <input type="text" id="playerId" placeholder="أدخل آيدي الحساب هنا (مثال: 948201948)">
            </div>
        </div>

        <div class="section-header">اختر باقة الجواهر المطلوبة</div>

        <!-- الباقات مع ألماسة حقيقية متقنة SVG -->
        <div class="grid-packages">
            
            <div class="pkg-card" onclick="selectPackage(this, 100, 1200)">
                <svg class="diamond-graphic" viewBox="0 0 100 100">
                    <polygon points="50,5 90,30 50,95 10,30" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2"/>
                    <polygon points="50,5 90,30 50,45" fill="#a5f3fc" opacity="0.6"/>
                    <polygon points="50,5 10,30 50,45" fill="#38bdf8" opacity="0.8"/>
                    <polygon points="10,30 50,45 30,70" fill="#0284c7" opacity="0.5"/>
                    <polygon points="90,30 50,45 70,70" fill="#0ea5e9" opacity="0.7"/>
                    <defs>
                        <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#00f2fe"/>
                            <stop offset="100%" stop-color="#4facfe"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="pkg-amount">100 جوهرة</div>
                <div class="pkg-price">1,200 دج</div>
            </div>

            <div class="pkg-card active" onclick="selectPackage(this, 310, 3500)">
                <svg class="diamond-graphic" viewBox="0 0 100 100">
                    <polygon points="50,5 90,30 50,95 10,30" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2"/>
                    <polygon points="50,5 90,30 50,45" fill="#a5f3fc" opacity="0.6"/>
                    <polygon points="50,5 10,30 50,45" fill="#38bdf8" opacity="0.8"/>
                    <polygon points="10,30 50,45 30,70" fill="#0284c7" opacity="0.5"/>
                    <polygon points="90,30 50,45 70,70" fill="#0ea5e9" opacity="0.7"/>
                </svg>
                <div class="pkg-amount">310 جوهرة</div>
                <div class="pkg-price">3,500 دج</div>
            </div>

            <div class="pkg-card" onclick="selectPackage(this, 520, 5800)">
                <svg class="diamond-graphic" viewBox="0 0 100 100">
                    <polygon points="50,5 90,30 50,95 10,30" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2"/>
                    <polygon points="50,5 90,30 50,45" fill="#a5f3fc" opacity="0.6"/>
                    <polygon points="50,5 10,30 50,45" fill="#38bdf8" opacity="0.8"/>
                    <polygon points="10,30 50,45 30,70" fill="#0284c7" opacity="0.5"/>
                    <polygon points="90,30 50,45 70,70" fill="#0ea5e9" opacity="0.7"/>
                </svg>
                <div class="pkg-amount">520 جوهرة</div>
                <div class="pkg-price">5,800 دج</div>
            </div>

            <div class="pkg-card" onclick="selectPackage(this, 1060, 11500)">
                <svg class="diamond-graphic" viewBox="0 0 100 100">
                    <polygon points="50,5 90,30 50,95 10,30" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2"/>
                    <polygon points="50,5 90,30 50,45" fill="#a5f3fc" opacity="0.6"/>
                    <polygon points="50,5 10,30 50,45" fill="#38bdf8" opacity="0.8"/>
                    <polygon points="10,30 50,45 30,70" fill="#0284c7" opacity="0.5"/>
                    <polygon points="90,30 50,45 70,70" fill="#0ea5e9" opacity="0.7"/>
                </svg>
                <div class="pkg-amount">1,060 جوهرة</div>
                <div class="pkg-price">11,500 دج</div>
            </div>

        </div>

        <button class="action-btn" onclick="executeRecharge()">تأكيد وإتمام الشحن</button>
    </div>

    <!-- نافذة الانتظار -->
    <div class="modal-bg" id="loadingModal">
        <div class="modal-content">
            <div class="loader-ring"></div>
            <div class="modal-header-text">يرجى الانتظار من فضلك</div>
            <div class="modal-sub-text">جاري الاتصال بقاعدة بيانات Garena ومعالجة الآيدي...</div>
        </div>
    </div>

    <!-- نافذة النجاح -->
    <div class="modal-bg" id="successModal">
        <div class="modal-content">
            <div class="success-badge">✓</div>
            <div class="modal-header-text">تم الشحن بنجاح</div>
            <div class="modal-sub-text" id="successDetails">تم تحويل الجواهر إلى الحساب بنجاح.</div>
            <button class="close-popup" onclick="closeModal()">موافق</button>
        </div>
    </div>

    <script>
        let myBalance = 12500; // الرصيد الابتدائي الحقيقي
        let chosenAmount = 310;
        let chosenPrice = 3500;

        function selectPackage(el, amount, price) {
            document.querySelectorAll('.pkg-card').forEach(card => card.classList.remove('active'));
            el.classList.add('active');
            chosenAmount = amount;
            chosenPrice = price;
        }

        function executeRecharge() {
            const playerIdVal = document.getElementById('playerId').value.trim();

            if(playerIdVal === "") {
                alert("الرجاء إدخال معرف اللاعب (ID) أولاً!");
                return;
            }

            if(myBalance < chosenPrice) {
                alert("الرصيد غير كافٍ لإتمام العملية!");
                return;
            }

            // إظهار نافذة التحميل والانتظار
            document.getElementById('loadingModal').style.display = 'flex';

            // محاكاة الاتصال الحقيقي (3 ثواني)
            setTimeout(() => {
                document.getElementById('loadingModal').style.display = 'none';

                // خصم المبلغ وتحديث الرصيد الفوقي مباشرة
                myBalance -= chosenPrice;
                document.getElementById('userBalance').textContent = myBalance.toLocaleString() + " دج";

                // كتابة تفاصيل النجاح
                document.getElementById('successDetails').innerHTML = `تم إرسال <b>${chosenAmount} جوهرة</b> بنجاح إلى الآيدي:<br><span style="color:var(--primary); font-weight:700;">${playerIdVal}</span>`;

                // إظهار نافذة النجاح النهائية
                document.getElementById('successModal').style.display = 'flex';

            }, 3000);
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }
    </script>
</body>
</html>
