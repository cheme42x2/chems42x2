<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعة ساعات رولاك الفاخرة</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-gold: #d4af37;
            --secondary-gold: #bfa130;
            --form-bg: #262626;
            --border-color: #404040;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Header */
        header {
            background-color: #000;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 14px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Product Section */
        .product-section {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            justify-content: center;
            margin-bottom: 50px;
            width: 100%;
        }

        .product-gallery {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            text-align: center;
        }

        .main-image {
            width: 100%;
            height: auto;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none; /* Hide all initially */
        }

        .main-image.active {
            display: block; /* Show active */
        }

        .thumbnail-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s, border-color 0.3s;
        }

        .thumbnail:hover, .thumbnail.active {
            opacity: 1;
            border-color: var(--accent-gold);
        }

        .product-details {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }

        .product-title {
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .product-subtitle {
            font-size: 18px;
            color: #999;
            margin-bottom: 20px;
        }

        .price-display {
            font-size: 32px;
            color: var(--accent-gold);
            margin-bottom: 30px;
            font-weight: bold;
        }

        .price-note {
            font-size: 14px;
            color: #888;
            display: block;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .features {
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
            color: #ccc;
        }

        .features li {
            margin-bottom: 10px;
            padding-left: 25px;
            position: relative;
        }

        .features li::before {
            content: '✓';
            color: var(--accent-gold);
            position: absolute;
            left: 0;
        }

        /* Order Form */
        .order-form-container {
            background-color: var(--form-bg);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 50px;
        }

        .form-title {
            font-size: 24px;
            color: var(--accent-gold);
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background-color: #333;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box; /* Important for padding */
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, var(--accent-gold), var(--secondary-gold));
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: linear-gradient(to right, var(--secondary-gold), var(--accent-gold));
        }

        /* Footer */
        footer {
            background-color: #000;
            padding: 30px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: #666;
        }

        /* Modal/Popup */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.8); 
        }

        .modal-content {
            background-color: var(--form-bg);
            margin: 15% auto; 
            padding: 40px;
            border: 1px solid var(--accent-gold);
            width: 80%; 
            max-width: 400px;
            border-radius: 8px;
            text-align: center;
            animation: popIn 0.5s;
        }

        @keyframes popIn {
            0% {transform: scale(0);}
            80% {transform: scale(1.1);}
            100% {transform: scale(1);}
        }

        .modal-check {
            font-size: 50px;
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            margin-bottom: 10px;
            color: #fff;
        }

        .modal-text {
            font-size: 16px;
            color: #ccc;
        }

        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover,
        .close-modal:focus {
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }
            .nav-links {
                gap: 15px;
            }
            .product-section {
                gap: 30px;
            }
            .product-title {
                font-size: 28px;
            }
            .price-display {
                font-size: 28px;
            }
        }
    </style>
</head>
