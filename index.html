<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ماكياجي · My Makeup</title>
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background: #1a1410;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }

    /* main phone frame */
    .app-frame {
      max-width: 400px;
      width: 100%;
      background: #f7f2ed;
      border-radius: 44px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 2px #d9c6b0 inset;
      overflow: hidden;
      position: relative;
      height: 780px;
      display: flex;
      flex-direction: column;
    }

    /* splash screen */
    .splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #d8b89a, #2c1e17);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.9s ease, transform 0.6s ease;
      pointer-events: none;
      border-radius: 44px;
    }
    .splash.hide {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }
    .splash-logo {
      font-size: 3.8rem;
      font-weight: 700;
      color: #f2e0d0;
      text-shadow: 0 8px 20px rgba(0,0,0,0.4);
      letter-spacing: 4px;
      background: rgba(255, 215, 190, 0.15);
      backdrop-filter: blur(6px);
      padding: 20px 40px;
      border-radius: 60px;
      border: 1px solid rgba(255, 215, 190, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .splash-sub {
      margin-top: 14px;
      color: #eedccd;
      font-weight: 300;
      letter-spacing: 6px;
      font-size: 1rem;
      background: rgba(0,0,0,0.2);
      padding: 8px 24px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
    }
    .splash-icon {
      font-size: 3rem;
      color: #f0d5c0;
      margin-top: 20px;
      opacity: 0.6;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 0.9; transform: scale(1.04); }
      100% { opacity: 0.4; transform: scale(0.98); }
    }

    /* main content */
    .main-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #f7f2ed;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
    }

    /* header + language switcher */
    .header {
      background: rgba(255, 247, 240, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 20px 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(210, 180, 160, 0.3);
    }
    .app-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #3e2a1e;
      letter-spacing: 1px;
    }
    .app-title i {
      color: #b2805e;
      margin-right: 6px;
    }
    .lang-switcher {
      display: flex;
      gap: 6px;
      background: #e7dbd0;
      padding: 4px 8px;
      border-radius: 30px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #3e2a1e;
      cursor: pointer;
      transition: 0.2s;
    }
    .lang-btn.active {
      background: #b2805e;
      color: white;
      box-shadow: 0 2px 8px rgba(178, 128, 94, 0.3);
    }

    /* scrollable content */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 80px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: #f7f2ed;
    }

    /* shop cards */
    .shop-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .shop-card {
      background: rgba(255, 248, 242, 0.7);
      backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 14px 14px 10px 14px;
      box-shadow: 0 6px 18px rgba(80, 50, 30, 0.08);
      border: 1px solid rgba(255, 215, 190, 0.3);
      transition: 0.2s;
    }
    .shop-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .shop-avatar {
      width: 54px;
      height: 54px;
      border-radius: 20px;
      background: #dccfc4;
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 2px solid #e6d3c4;
    }
    .shop-name {
      font-weight: 700;
      font-size: 1rem;
      color: #2d1e14;
    }
    .shop-desc {
      font-size: 0.7rem;
      color: #7d6554;
      font-weight: 400;
    }

    /* product row inside shop */
    .product-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0 4px 0;
      scrollbar-width: thin;
      scrollbar-color: #d9c6b0 #f0e6dc;
    }
    .product-item {
      min-width: 98px;
      background: white;
      border-radius: 24px;
      padding: 8px 6px 10px 6px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(100, 70, 40, 0.06);
      border: 1px solid #efe4da;
      flex-shrink: 0;
      position: relative;
    }
    .product-img {
      width: 70px;
      height: 70px;
      border-radius: 30px;
      background: #f0e4d8;
      margin: 0 auto 6px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      transition: 0.2s;
      cursor: pointer;
    }
    .product-img:active {
      transform: scale(0.96);
    }
    .product-name {
      font-size: 0.6rem;
      font-weight: 600;
      color: #2d1e14;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-price {
      font-size: 0.65rem;
      font-weight: 600;
      color: #b2805e;
      margin: 2px 0;
    }
    .add-btn {
      background: #b2805e;
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 300;
      box-shadow: 0 4px 8px rgba(178, 128, 94, 0.2);
      cursor: pointer;
      transition: 0.15s;
      margin-top: 2px;
    }
    .add-btn:active {
      transform: scale(0.9);
      background: #9a6d4e;
    }

    /* bottom cart bar */
    .cart-bar {
      position: absolute;
      bottom: 70px;
      left: 16px;
      right: 16px;
      background: rgba(30, 20, 15, 0.85);
      backdrop-filter: blur(18px);
      border-radius: 60px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 215, 190, 0.2);
      color: #f2e0d0;
      z-index: 50;
    }
    .cart-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cart-total {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .cart-price {
      font-weight: 600;
      color: #f0cfb0;
    }
    .checkout-btn {
      background: #dbb594;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      color: #1f140e;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(219, 181, 148, 0.3);
    }
    .checkout-btn:active {
      transform: scale(0.94);
    }

    /* bottom nav */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background: rgba(255, 247, 240, 0.85);
      backdrop-filter: blur(16px);
      padding: 8px 0 10px 0;
      border-top: 1px solid rgba(210, 180, 160, 0.25);
      border-radius: 0 0 44px 44px;
      margin-top: auto;
      flex-shrink: 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #7d6554;
      font-size: 0.6rem;
      font-weight: 500;
      transition: 0.2s;
      cursor: default;
    }
    .nav-item i {
      font-size: 1.4rem;
      margin-bottom: 2px;
      color: #5d4334;
    }
    .nav-item.active i {
      color: #b2805e;
    }

    /* modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      border-radius: 44px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: #fcf5ee;
      padding: 30px 28px;
      border-radius: 48px;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 40px 60px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 215, 190, 0.3);
      transform: scale(0.92);
      transition: 0.25s;
      text-align: center;
    }
    .modal-overlay.show .modal-box {
      transform: scale(1);
    }
    .modal-box h3 {
      color: #2d1e14;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .modal-box input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 40px;
      border: 1px solid #dccfc4;
      background: white;
      font-size: 1rem;
      margin: 8px 0 18px 0;
      outline: none;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .modal-actions button {
      padding: 10px 30px;
      border-radius: 40px;
      border: none;
      background: #b2805e;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .modal-actions button:active { transform: scale(0.94); }
    .modal-actions .cancel-btn {
      background: #d0bfb2;
      color: #2d1e14;
    }

    .toast {
      position: absolute;
      bottom: 150px;
      left: 20px;
      right: 20px;
      background: #2d1e14;
      color: #f2e0d0;
      padding: 14px 18px;
      border-radius: 40px;
      text-align: center;
      font-weight: 500;
      font-size: 0.8rem;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      pointer-events: none;
    }

    /* scrollbar */
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: #e7dbd0; border-radius: 10px; }
    .scroll-area::-webkit-scrollbar-thumb { background: #b2805e; border-radius: 10px; }
  </style>
</head>
<body>
<div class="app-frame" id="app">
  <!-- SPLASH -->
  <div class="splash" id="splash">
    <div class="splash-logo">ماكياجي</div>
    <div class="splash-sub">MY MAKEUP</div>
    <div class="splash-icon"><i class="fas fa-spa"></i></div>
  </div>

  <!-- MAIN -->
  <div class="main-content" id="mainContent">
    <!-- header -->
    <div class="header">
      <div class="app-title"><i class="fas fa-crown"></i> ماكياجي</div>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ar">AR</button>
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <!-- scroll -->
    <div class="scroll-area" id="scrollArea">
      <div class="shop-grid" id="shopGrid"></div>
    </div>

    <!-- cart bar -->
    <div class="cart-bar" id="cartBar">
      <div class="cart-info">
        <span><i class="fas fa-shopping-bag"></i> <span id="cartCount">0</span></span>
        <span class="cart-price" id="cartTotalPrice">0 دج</span>
        <span style="font-size:0.7rem; opacity:0.7;">+200 دج</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">تأكيد الطلب</button>
    </div>

    <!-- bottom nav -->
    <div class="bottom-nav">
      <div class="nav-item active"><i class="fas fa-home"></i><span>Home</span></div>
      <div class="nav-item"><i class="fas fa-heart"></i><span>Shops</span></div>
      <div class="nav-item"><i class="fas fa-bell"></i><span>Alerts</span></div>
      <div class="nav-item"><i class="fas fa-user"></i><span>Profile</span></div>
    </div>

    <!-- modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h3><i class="fas fa-phone-alt" style="color:#b2805e;"></i> رقم الهاتف</h3>
        <input type="tel" id="phoneInput" placeholder="05 xx xx xx xx" />
        <div class="modal-actions">
          <button class="cancel-btn" id="modalCancel">إلغاء</button>
          <button id="modalConfirm">تأكيد</button>
        </div>
      </div>
    </div>

    <!-- toast -->
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
  (function(){
    // ----- DATA -----
    const shops = [
      { id:0, name: 'Chanel Luxe', avatar: 'https://picsum.photos/id/1/100/100', products: [
        { name: 'Rouge Coco', price: 8500, img: 'https://picsum.photos/id/152/80/80' },
        { name: 'Sublimage', price: 22000, img: 'https://picsum.photos/id/225/80/80' },
        { name: 'Le Vernis', price: 4800, img: 'https://picsum.photos/id/248/80/80' }
      ]},
      { id:1, name: 'Dior Privé', avatar: 'https://picsum.photos/id/100/100/100', products: [
        { name: 'J\'adore', price: 12000, img: 'https://picsum.photos/id/180/80/80' },
        { name: 'Rouge 999', price: 7600, img: 'https://picsum.photos/id/196/80/80' },
        { name: 'Backstage', price: 9400, img: 'https://picsum.photos/id/231/80/80' }
      ]},
      { id:2, name: 'YSL Beauty', avatar: 'https://picsum.photos/id/104/100/100', products: [
        { name: 'Touche Éclat', price: 8900, img: 'https://picsum.photos/id/279/80/80' },
        { name: 'Black Opium', price: 13500, img: 'https://picsum.photos/id/258/80/80' },
        { name: 'Rouge Pur', price: 7800, img: 'https://picsum.photos/id/277/80/80' }
      ]},
      { id:3, name: 'Guerlain', avatar: 'https://picsum.photos/id/124/100/100', products: [
        { name: 'Meteorites', price: 11200, img: 'https://picsum.photos/id/203/80/80' },
        { name: 'L\'Or Rouge', price: 28000, img: 'https://picsum.photos/id/173/80/80' },
        { name: 'KissKiss', price: 6300, img: 'https://picsum.photos/id/185/80/80' }
      ]},
      { id:4, name: 'Clarins', avatar: 'https://picsum.photos/id/147/100/100', products: [
        { name: 'Double Serum', price: 14200, img: 'https://picsum.photos/id/267/80/80' },
        { name: 'Lip Perfector', price: 5200, img: 'https://picsum.photos/id/286/80/80' },
        { name: 'Eau Dynamisante', price: 9800, img: 'https://picsum.photos/id/192/80/80' }
      ]}
    ];

    const translations = {
      ar: { checkout: 'تأكيد الطلب', cart: 'السلة', total: 'المجموع', delivery: 'التوصيل', phonePlaceholder: '05 xx xx xx xx', confirm: 'تأكيد', cancel: 'إلغاء', toastOrder: 'تم إرسال الطلب إلى المسؤول' },
      fr: { checkout: 'Confirmer', cart: 'Panier', total: 'Total', delivery: 'Livraison', phonePlaceholder: '05 xx xx xx xx', confirm: 'Confirmer', cancel: 'Annuler', toastOrder: 'Commande envoyée' },
      en: { checkout: 'Confirm Order', cart: 'Cart', total: 'Total', delivery: 'Delivery', phonePlaceholder: '05 xx xx xx xx', confirm: 'Confirm', cancel: 'Cancel', toastOrder: 'Order sent to admin' }
    };
    let currentLang = 'ar';
    let cart = []; // { shopId, productIndex, name, price }
    let cartCount = 0;
    let totalPrice = 0;
    const DELIVERY = 200;

    // DOM refs
    const shopGrid = document.getElementById('shopGrid');
    const cartCountEl = document.getElementById('cartCount');
    const cartTotalPrice = document.getElementById('cartTotalPrice');
    const modalOverlay = document.getElementById('modalOverlay');
    const phoneInput = document.getElementById('phoneInput');
    const toast = document.getElementById('toast');
    const splash = document.getElementById('splash');

    // ----- RENDER SHOPS -----
    function renderShops() {
      let html = '';
      shops.forEach((shop, idx) => {
        html += `<div class="shop-card" data-shop-id="${shop.id}">
          <div class="shop-header">
            <div class="shop-avatar" style="background-image: url('${shop.avatar}')"></div>
            <div><div class="shop-name">${shop.name}</div><div class="shop-desc">✨ 5 produits</div></div>
          </div>
          <div class="product-row">`;
        shop.products.forEach((p, pIdx) => {
          html += `<div class="product-item" data-shop="${shop.id}" data-product="${pIdx}">
            <div class="product-img" style="background-image: url('${p.img}')" onclick="rotateProduct(this)"></div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price} دج</div>
            <button class="add-btn" data-shop="${shop.id}" data-product="${pIdx}">+</button>
          </div>`;
        });
        html += `</div></div>`;
      });
      shopGrid.innerHTML = html;
      // attach add events
      document.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const shopId = parseInt(this.dataset.shop);
          const prodIdx = parseInt(this.dataset.product);
          addToCart(shopId, prodIdx);
        });
      });
    }

    // 360 rotation simulation (multi-angle)
    window.rotateProduct = function(imgEl) {
      const current = imgEl.style.backgroundImage;
      const base = current.slice(5, -2).replace(/"/g, ''); 
      // simulate angle change by loading a different pic from picsum
      const newId = Math.floor(Math.random() * 100) + 200;
      imgEl.style.backgroundImage = `url('https://picsum.photos/id/${newId}/80/80')`;
      imgEl.style.transition = '0.3s';
      setTimeout(() => {
        imgEl.style.backgroundImage = current;
      }, 800);
      showToast('🔄 360° view');
    };

    // ----- CART -----
    function addToCart(shopId, prodIdx) {
      const shop = shops.find(s => s.id === shopId);
      if (!shop) return;
      const product = shop.products[prodIdx];
      if (!product) return;
      cart.push({ shopId, productIdx: prodIdx, name: product.name, price: product.price });
      updateCartUI();
      showToast(`✨ ${product.name} +1`);
    }

    function updateCartUI() {
      cartCount = cart.length;
      totalPrice = cart.reduce((acc, item) => acc + item.price, 0);
      cartCountEl.textContent = cartCount;
      const totalWithDelivery = totalPrice + DELIVERY;
      cartTotalPrice.textContent = totalWithDelivery + ' دج';
    }

    // ----- CHECKOUT -----
    function openCheckout() {
      if (cart.length === 0) {
        showToast('🛒 السلة فارغة');
        return;
      }
      modalOverlay.classList.add('show');
      phoneInput.value = '';
    }

    function confirmOrder() {
      const phone = phoneInput.value.trim();
      if (!phone || phone.length < 8) {
        showToast('📱 الرجاء إدخال رقم هاتف صحيح');
        return;
      }
      // build order message
      let items = cart.map(i => `${i.name} (${i.price} دج)`).join(', ');
      const total = totalPrice + DELIVERY;
      const msg = `📦 طلب جديد\n📞 ${phone}\n🛍️ ${items}\n💰 المجموع: ${total} دج (شامل التوصيل 200 دج)`;
      // simulate whatsapp / admin alert
      console.log('ORDER:', msg);
      alert('✅ تم إرسال الطلب إلى المسؤول (محاكاة) \n' + msg);
      // reset cart
      cart = [];
      updateCartUI();
      modalOverlay.classList.remove('show');
      showToast('📨 تم تأكيد الطلب');
    }

    // ----- TOAST -----
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ----- LANGUAGE -----
    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.lang-btn[data-lang="${lang}"]`).classList.add('active');
      const t = translations[lang];
      document.getElementById('checkoutBtn').textContent = t.checkout;
      document.querySelector('.cart-info span:first-child i + span').textContent = t.cart;
      document.querySelector('.cart-info span:last-child').textContent = `+${DELIVERY} دج`;
      document.getElementById('phoneInput').placeholder = t.phonePlaceholder;
      document.querySelector('.modal-actions .cancel-btn').textContent = t.cancel;
      document.querySelector('#modalConfirm').textContent = t.confirm;
    }

    // ----- INIT -----
    function init() {
      renderShops();
      updateCartUI();

      // splash hide after 2.4s
      setTimeout(() => {
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 600);
      }, 2400);

      // lang buttons
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const lang = this.dataset.lang;
          setLanguage(lang);
        });
      });

      // checkout
      document.getElementById('checkoutBtn').addEventListener('click', openCheckout);
      document.getElementById('modalCancel').addEventListener('click', () => {
        modalOverlay.classList.remove('show');
      });
      document.getElementById('modalConfirm').addEventListener('click', confirmOrder);
      // close modal on overlay click
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === this) modalOverlay.classList.remove('show');
      });

      setLanguage('ar');
    }

    init();
  })();
</script>
</body>
</html>
