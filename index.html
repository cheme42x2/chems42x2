<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماكياجي | Makyaji - Ultra Luxury</title>
    <style>
        /* =========================================
           Design Tokens & Atomic CSS (Zero-Runtime)
           ========================================= */
        :root {
            --luxury-gold: #d4af37;
            --luxury-rose: #f4c2c2;
            --bg-dark: #050505;
            --text-light: #f9f9f9;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* 1. Cinematic Intro Screen */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #webgl-intro {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .intro-title {
            position: relative;
            z-index: 2;
            font-size: 5rem;
            letter-spacing: 5px;
            background: linear-gradient(45deg, var(--luxury-gold), var(--luxury-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 300;
        }

        /* 2. Horizontal Store Layout & UI */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }
        
        button {
            background: var(--luxury-gold);
            color: var(--bg-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }

        .store-container {
            display: flex;
            width: 300vw; /* Horizontal width for multiple stores */
            height: 100vh;
            padding-top: 80px;
        }

        .store-card {
            width: 100vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            view-transition-name: store-hero;
            cursor: pointer;
            border-right: 1px solid var(--glass-border);
        }

        .product-grid {
            display: none; /* Shows on click */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
            width: 100%;
        }

        /* 3. Mini Game (X/O) - Waiting Screen */
        #waiting-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            margin-top: 20px;
        }
        .cell {
            width: 100px; height: 100px;
            background: var(--glass-bg);
            border: 1px solid var(--luxury-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Cinematic Intro -->
    <div id="intro-screen">
        <canvas id="webgl-intro"></canvas>
        <h1 class="intro-title" data-i18n="title">ماكياجي</h1>
    </div>

    <!-- Main UI -->
    <header>
        <h2 data-i18n="title">ماكياجي</h2>
        <div>
            <button id="lang-btn">EN / AR</button>
            <button id="login-btn" data-i18n="checkout">الدفع</button>
            <span style="margin-right: 15px;" data-i18n="cart">السلة: 0</span>
        </div>
    </header>

    <!-- Horizontal Stores Slider -->
    <main class="store-container" id="main-container">
        <!-- Store 1 -->
        <section class="store-card">
            <h1>Chanel Boutique</h1>
            <p data-i18n="delivery">التوصيل (200 دج)</p>
            <div class="product-grid">
                <!-- Products will be injected via JS -->
            </div>
        </section>
        <!-- Store 2 -->
        <section class="store-card">
            <h1>Dior Cosmetics</h1>
            <p data-i18n="delivery">التوصيل (200 دج)</p>
        </section>
        <!-- Store 3 -->
        <section class="store-card">
            <h1>Yves Saint Laurent</h1>
            <p data-i18n="delivery">التوصيل (200 دج)</p>
        </section>
    </main>

    <!-- Delivery Minigame Screen -->
    <div id="waiting-screen">
        <h2 style="color: var(--luxury-gold);">جاري البحث عن مندوب توصيل...</h2>
        <p>العب X/O مع الذكاء الاصطناعي ريثما نؤكد طلبك</p>
        <div class="board" id="tic-tac-toe-board">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
    </div>

    <!-- =========================================
         Core Logic (JavaScript ES Modules)
         ========================================= -->
    <script type="module">
        // 1. Imports from ES Modules (CDN)
        import * as THREE from 'https://esm.sh/three';
        import { gsap } from 'https://esm.sh/gsap';
        import Lenis from 'https://esm.sh/@studio-freight/lenis';
        import { initializeApp } from 'https://esm.sh/firebase/app';
        import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://esm.sh/firebase/auth';

        /* ---------------------------------------------------
           Part 1: WebGL Cinematic Intro & Liquid Shaders
           --------------------------------------------------- */
        const canvas = document.querySelector('#webgl-intro');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 2;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const material = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 } },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;
                void main() {
                    vec2 p = vUv - 0.5;
                    float r = length(p);
                    float wave = sin(r * 10.0 - uTime * 2.0) * 0.5 + 0.5;
                    vec3 color = mix(vec3(0.83, 0.68, 0.21), vec3(0.95, 0.76, 0.76), wave); // Gold to Rose
                    gl_FragColor = vec4(color, 0.6);
                }
            `,
            transparent: true
        });

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.5, 32, 32), material);
        scene.add(mesh);

        const clock = new THREE.Clock();
        function animateIntro() {
            material.uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
            requestAnimationFrame(animateIntro);
        }
        animateIntro();

        // Fade out Intro after 3.5 seconds
        setTimeout(() => {
            gsap.to('#intro-screen', { opacity: 0, duration: 1.5, ease: 'power4.inOut', onComplete: () => {
                document.querySelector('#intro-screen').style.display = 'none';
            }});
        }, 3500);

        /* ---------------------------------------------------
           Part 2: Physics Scroll (Lenis) & Haptics
           --------------------------------------------------- */
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // Spring physics
            direction: 'horizontal',
            smooth: true,
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // Haptic Feedback Simulation on Hover
        document.querySelectorAll('.store-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                if (navigator.vibrate) navigator.vibrate(15);
            });
        });

        /* ---------------------------------------------------
           Part 3: View Transitions API & Optimistic UI
           --------------------------------------------------- */
        const mainContainer = document.getElementById('main-container');
        document.querySelectorAll('.store-card').forEach(card => {
            card.addEventListener('click', () => {
                // Haptic Click
                if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

                if (document.startViewTransition) {
                    document.startViewTransition(() => {
                        mainContainer.style.flexDirection = 'column';
                        mainContainer.style.width = '100vw';
                        lenis.destroy(); // Stop horizontal scroll, switch to native vertical
                        card.querySelector('.product-grid').style.display = 'grid';
                    });
                } else {
                    mainContainer.style.flexDirection = 'column';
                    mainContainer.style.width = '100vw';
                    card.querySelector('.product-grid').style.display = 'grid';
                }
            });
        });

        /* ---------------------------------------------------
           Part 4: Firebase Auth (Mock setup for structure) & Checkout
           --------------------------------------------------- */
        // Note: Put your real 2026 Firebase config here
        const firebaseConfig = { apiKey: "MOCK_KEY", authDomain: "mock.firebaseapp.com" }; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('login-btn').addEventListener('click', () => {
            // Simulated login for demo purposes
            alert("سيتم تحويلك لتسجيل الدخول بحساب Google...");
            setTimeout(() => {
                let phone = prompt("تم تسجيل الدخول! يرجى إدخال رقم هاتفك لتأكيد الطلب وتوصيله:");
                if(phone) {
                    document.getElementById('waiting-screen').style.display = 'flex';
                }
            }, 1000);
        });

        /* ---------------------------------------------------
           Part 5: Minigame AI (Tic-Tac-Toe) during waiting
           --------------------------------------------------- */
        const cells = document.querySelectorAll('.cell');
        let board = Array(9).fill(null);
        let human = 'X', ai = 'O';

        function checkWin(b) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let w of wins) {
                if(b[w[0]] && b[w[0]] === b[w[1]] && b[w[0]] === b[w[2]]) return b[w[0]];
            }
            return b.includes(null) ? null : 'Tie';
        }

        cells.forEach((cell, idx) => {
            cell.addEventListener('click', () => {
                if(!board[idx]) {
                    board[idx] = human;
                    cell.innerText = human;
                    cell.style.color = "var(--text-light)";
                    if(!checkWin(board)) setTimeout(aiMove, 400);
                }
            });
        });

        function aiMove() {
            let available = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if(available.length > 0) {
                let move = available[Math.floor(Math.random() * available.length)];
                board[move] = ai;
                cells[move].innerText = ai;
                cells[move].style.color = "var(--luxury-gold)";
                
                let result = checkWin(board);
                if(result) setTimeout(() => alert(result === 'Tie' ? "تعادل!" : "انتهت اللعبة! مندوب التوصيل في الطريق."), 500);
            }
        }

        /* ---------------------------------------------------
           Part 6: i18n (Dynamic Language Switcher)
           --------------------------------------------------- */
        const translations = {
            ar: { title: "ماكياجي", cart: "السلة: 0", checkout: "الدفع", delivery: "التوصيل (200 دج)" },
            en: { title: "Makyaji", cart: "Cart: 0", checkout: "Checkout", delivery: "Delivery (200 DZD)" }
        };
        let currentLang = 'ar';

        document.getElementById('lang-btn').addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = translations[currentLang][key];
            });
        });
    </script>
</body>
</html>
