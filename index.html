<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Maison Éclat — Curated Makeup, Delivered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MAISON ÉCLAT — DESIGN TOKENS
   Palette: velvet charcoal / matte obsidian / rosewood / bronze
   Type: Fraunces (display serif) + Manrope (UI body) + Tajawal (Arabic)
   ============================================================ */
:root{
  --obsidian:#0a0908;
  --charcoal:#15120f;
  --charcoal-2:#1c1815;
  --charcoal-3:#241f1a;
  --hairline:rgba(230,214,190,0.09);
  --hairline-strong:rgba(230,214,190,0.16);
  --glass:rgba(255,255,255,0.045);
  --glass-strong:rgba(255,255,255,0.075);
  --rosewood:#7a2f40;
  --rosewood-light:#a04a5e;
  --rosewood-deep:#4f1d2a;
  --bronze:#b9945e;
  --bronze-light:#d9bd8c;
  --bronze-deep:#8a6a3c;
  --cream:#efe6d8;
  --cream-dim:#c9bda9;
  --muted:#8f8578;
  --muted-2:#6b6255;
  --success:#5e9d76;
  --success-dim:#3c6349;
  --danger:#b0584a;
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,0.65);
  --shadow-md:0 12px 30px -12px rgba(0,0,0,0.55);
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --font-display:'Fraunces',serif;
  --font-body:'Manrope',sans-serif;
  --font-arabic:'Tajawal',sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-tap-highlight-color:transparent;}
body{
  min-height:100vh;
  background:
    radial-gradient(120% 60% at 15% -10%, rgba(122,47,64,0.16), transparent 55%),
    radial-gradient(90% 50% at 100% 0%, rgba(185,148,94,0.10), transparent 50%),
    var(--obsidian);
  color:var(--cream);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.lang-ar, body.lang-ar input, body.lang-ar button, body.lang-ar select{
  font-family:var(--font-arabic);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input{font-family:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
::selection{background:var(--bronze);color:var(--obsidian);}
::-webkit-scrollbar{width:0;height:0;}

/* Focus visibility for accessibility */
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:2px solid var(--bronze-light);
  outline-offset:2px;
  border-radius:8px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell{
  max-width:480px;
  min-height:100vh;
  margin:0 auto;
  position:relative;
  background:linear-gradient(180deg,var(--obsidian) 0%, var(--charcoal) 100%);
  display:flex;
  flex-direction:column;
  box-shadow:0 0 90px rgba(0,0,0,0.6);
}

/* Faint gold foil texture overlay for luxury matte finish */
.app-shell::before{
  content:"";
  position:fixed;
  inset:0;
  max-width:480px;
  margin:0 auto;
  pointer-events:none;
  background-image:
    repeating-linear-gradient(115deg, rgba(217,189,140,0.018) 0px, rgba(217,189,140,0.018) 1px, transparent 1px, transparent 3px);
  z-index:0;
  opacity:0.5;
}

/* ============================================================
   TOP HEADER
   ============================================================ */
.top-header{
  position:sticky;
  top:0;
  z-index:40;
  padding:calc(14px + var(--safe-top)) 18px 12px;
  background:linear-gradient(180deg, rgba(10,9,8,0.97) 60%, rgba(10,9,8,0.88));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--hairline);
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.location-block{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  cursor:pointer;
}
.location-icon{
  width:34px;height:34px;flex:0 0 34px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,var(--rosewood),var(--rosewood-deep));
  border:1px solid var(--hairline-strong);
}
.location-text{min-width:0;}
.location-label{
  font-size:10.5px;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}
.location-name{
  font-family:var(--font-display);
  font-size:16px;
  font-weight:500;
  color:var(--cream);
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.lang-switch{
  display:flex;
  background:var(--glass);
  border:1px solid var(--hairline);
  border-radius:999px;
  padding:3px;
  gap:2px;
  flex:0 0 auto;
}
.lang-btn{
  padding:6px 10px;
  border-radius:999px;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:0.03em;
  color:var(--muted);
  transition:all .25s ease;
}
.lang-btn.active{
  background:linear-gradient(155deg,var(--bronze-light),var(--bronze-deep));
  color:var(--obsidian);
}

.search-bar{
  margin-top:14px;
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--glass);
  border:1px solid var(--hairline);
  border-radius:16px;
  padding:12px 14px;
  transition:border-color .2s ease, background .2s ease;
}
.search-bar:focus-within{
  border-color:var(--bronze);
  background:var(--glass-strong);
}
.search-bar svg{flex:0 0 auto;color:var(--muted);}
.search-bar input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  font-size:14.5px;
  color:var(--cream);
}
.search-bar input::placeholder{color:var(--muted-2);}

/* Category pills */
.category-pills{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:14px;
  padding-bottom:2px;
  scrollbar-width:none;
}
.category-pills::-webkit-scrollbar{display:none;}
.pill{
  flex:0 0 auto;
  padding:9px 16px;
  border-radius:999px;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:0.01em;
  background:var(--glass);
  border:1px solid var(--hairline);
  color:var(--cream-dim);
  white-space:nowrap;
  transition:all .22s ease;
}
.pill.active{
  background:linear-gradient(140deg,var(--rosewood-light),var(--rosewood-deep));
  border-color:transparent;
  color:var(--cream);
  box-shadow:0 8px 20px -8px rgba(122,47,64,0.7);
}

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.app-main{
  flex:1;
  position:relative;
  z-index:1;
  padding-bottom:calc(96px + var(--safe-bottom));
}
.section{padding:22px 18px 6px;}
.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:14px;
}
.section-title{
  font-family:var(--font-display);
  font-size:21px;
  font-weight:500;
  letter-spacing:0.01em;
  color:var(--cream);
}
.section-link{
  font-size:12px;
  font-weight:700;
  color:var(--bronze-light);
  letter-spacing:0.02em;
}

/* Banner Slider */
.banner-wrap{
  padding:18px 18px 0;
}
.banner-viewport{
  position:relative;
  border-radius:var(--radius-lg);
  overflow:hidden;
  height:168px;
  box-shadow:var(--shadow-md);
  border:1px solid var(--hairline-strong);
}
.banner-track{
  display:flex;
  height:100%;
  transition:transform .55s cubic-bezier(.65,0,.35,1);
}
.banner-slide{
  flex:0 0 100%;
  height:100%;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:20px;
  background-size:cover;
  background-position:center;
}
.banner-slide::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(0deg, rgba(10,8,7,0.92) 10%, rgba(10,8,7,0.25) 55%, rgba(10,8,7,0.15) 100%);
}
.banner-copy{position:relative;z-index:1;}
.banner-eyebrow{
  font-size:10.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--bronze-light);
  font-weight:700;
  margin-bottom:6px;
}
.banner-title{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:600;
  color:var(--cream);
  max-width:280px;
  line-height:1.15;
}
.banner-dots{
  position:absolute;
  bottom:14px;
  inset-inline-end:16px;
  display:flex;
  gap:6px;
  z-index:2;
}
.banner-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(239,230,216,0.35);
  transition:all .3s ease;
}
.banner-dot.active{
  width:18px;
  background:var(--bronze-light);
}

/* Store & Category grid tiles (home quick categories) */
.tile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.cat-tile{
  background:var(--glass);
  border:1px solid var(--hairline);
  border-radius:var(--radius-md);
  padding:14px 10px 12px;
  text-align:center;
  transition:transform .2s ease, border-color .2s ease, background .2s ease;
}
.cat-tile:active{transform:scale(0.96);}
.cat-tile-icon{
  width:44px;height:44px;
  margin:0 auto 8px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--bronze),var(--bronze-deep));
  color:var(--obsidian);
}
.cat-tile-label{
  font-size:11.5px;
  font-weight:700;
  color:var(--cream-dim);
  line-height:1.25;
}

/* Store Card */
.store-list{display:flex;flex-direction:column;gap:14px;}
.store-card{
  background:linear-gradient(160deg,var(--charcoal-2),var(--charcoal));
  border:1px solid var(--hairline);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-md);
  transition:transform .2s ease, border-color .2s ease;
}
.store-card:active{transform:scale(0.985);}
.store-cover{
  position:relative;
  height:132px;
  background-size:cover;
  background-position:center;
}
.store-cover::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(10,8,7,0) 45%, rgba(10,8,7,0.85) 100%);
}
.status-chip{
  position:absolute;
  top:12px;
  inset-inline-start:12px;
  z-index:2;
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 11px 5px 8px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:0.04em;
  text-transform:uppercase;
  backdrop-filter:blur(10px);
}
body.lang-ar .status-chip{padding:5px 8px 5px 11px;}
.status-chip.open{background:rgba(94,157,118,0.22);color:#9fe3ba;border:1px solid rgba(159,227,186,0.35);}
.status-chip.closed{background:rgba(176,88,74,0.22);color:#f0a99a;border:1px solid rgba(240,169,154,0.3);}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.status-dot.pulse{animation:pulse-dot 1.8s ease-in-out infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(159,227,186,0.55);}50%{opacity:0.7;box-shadow:0 0 0 5px rgba(159,227,186,0);}}

.rating-chip{
  position:absolute;
  top:12px;
  inset-inline-end:12px;
  z-index:2;
  display:flex;
  align-items:center;
  gap:4px;
  padding:5px 10px;
  border-radius:999px;
  font-size:11.5px;
  font-weight:800;
  background:rgba(10,8,7,0.55);
  border:1px solid var(--hairline-strong);
  backdrop-filter:blur(10px);
  color:var(--bronze-light);
}
.store-cover-title{
  position:absolute;
  bottom:12px;
  inset-inline-start:16px;
  inset-inline-end:16px;
  z-index:2;
}
.store-name{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:600;
  color:var(--cream);
}
.store-body{padding:12px 16px 16px;}
.store-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:10px;
}
.tag{
  font-size:10.5px;
  font-weight:700;
  padding:4px 9px;
  border-radius:999px;
  background:var(--glass);
  border:1px solid var(--hairline);
  color:var(--cream-dim);
  letter-spacing:0.01em;
}
.store-meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
}
.meta-item{display:flex;align-items:center;gap:5px;}
.meta-item svg{flex:0 0 auto;}
.meta-strong{color:var(--cream-dim);font-weight:700;}

/* ============================================================
   STORE DETAIL SCREEN
   ============================================================ */
.detail-hero{
  position:relative;
  height:220px;
  background-size:cover;
  background-position:center;
}
.detail-hero::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(10,8,7,0.35) 0%, rgba(10,8,7,0.55) 55%, var(--obsidian) 100%);
}
.detail-nav{
  position:absolute;
  top:calc(14px + var(--safe-top));
  inset-inline-start:16px;
  inset-inline-end:16px;
  display:flex;
  justify-content:space-between;
  z-index:3;
}
.circle-btn{
  width:38px;height:38px;
  border-radius:50%;
  background:rgba(10,8,7,0.55);
  border:1px solid var(--hairline-strong);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  color:var(--cream);
}
.detail-header-info{
  position:relative;
  z-index:2;
  padding:0 18px 18px;
  margin-top:-58px;
}
.detail-title{
  font-family:var(--font-display);
  font-size:27px;
  font-weight:600;
  color:var(--cream);
  margin-bottom:8px;
}
.detail-sub{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:12px;
}
.detail-desc{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
  max-width:100%;
}
.product-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:6px 18px 18px;
}
.product-card{
  background:var(--charcoal-2);
  border:1px solid var(--hairline);
  border-radius:var(--radius-md);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:var(--shadow-md);
}
.product-img-wrap{
  position:relative;
  height:132px;
  background-size:cover;
  background-position:center;
}
.product-add-btn{
  position:absolute;
  bottom:8px;
  inset-inline-end:8px;
  width:32px;height:32px;
  border-radius:10px;
  background:linear-gradient(150deg,var(--bronze-light),var(--bronze-deep));
  color:var(--obsidian);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px -6px rgba(185,148,94,0.65);
  transition:transform .15s ease;
}
.product-add-btn:active{transform:scale(0.88);}
.product-info{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:4px;}
.product-name{
  font-size:13px;
  font-weight:700;
  color:var(--cream);
  line-height:1.3;
  min-height:34px;
}
.product-rating{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  color:var(--bronze-light);
  font-weight:700;
}
.product-price-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:4px;
}
.product-price{
  font-family:var(--font-display);
  font-size:15.5px;
  font-weight:600;
  color:var(--cream);
}
.product-price small{font-size:10.5px;color:var(--muted);font-weight:600;margin-inline-start:2px;}
.qty-stepper{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--glass-strong);
  border:1px solid var(--hairline-strong);
  border-radius:10px;
  padding:3px 6px;
}
.qty-stepper button{
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  color:var(--bronze-light);
  font-weight:800;
  font-size:14px;
}
.qty-stepper span{font-size:12px;font-weight:800;min-width:14px;text-align:center;}

/* ============================================================
   FLOATING CART BAR
   ============================================================ */
.floating-cart{
  position:fixed;
  left:50%;
  transform:translateX(-50%) translateY(0);
  bottom:calc(78px + var(--safe-bottom));
  width:calc(100% - 36px);
  max-width:444px;
  z-index:45;
  background:linear-gradient(135deg,var(--rosewood-light),var(--rosewood-deep));
  border-radius:18px;
  padding:13px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 18px 40px -14px rgba(122,47,64,0.75);
  border:1px solid rgba(217,189,140,0.25);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.floating-cart.hidden{
  transform:translateX(-50%) translateY(120%);
  opacity:0;
  pointer-events:none;
}
.fc-left{display:flex;align-items:center;gap:10px;}
.fc-badge{
  width:30px;height:30px;
  border-radius:9px;
  background:rgba(10,8,7,0.35);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--cream);
}
.fc-text{display:flex;flex-direction:column;line-height:1.2;}
.fc-title{font-size:12.5px;font-weight:800;color:var(--cream);}
.fc-sub{font-size:10.5px;color:rgba(239,230,216,0.75);}
.fc-cta{
  display:flex;align-items:center;gap:6px;
  background:rgba(10,8,7,0.32);
  padding:8px 14px;
  border-radius:11px;
  font-size:12px;font-weight:800;color:var(--cream);
}

/* ============================================================
   BOTTOM NAVIGATION
   ============================================================ */
.bottom-nav{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:50;
  max-width:480px;
  margin:0 auto;
  padding:10px 10px calc(10px + var(--safe-bottom));
  background:rgba(10,9,8,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--hairline);
  display:flex;
  justify-content:space-between;
}
.nav-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:6px 2px;
  color:var(--muted);
  position:relative;
  transition:color .2s ease;
}
.nav-item.active{color:var(--bronze-light);}
.nav-item svg{width:21px;height:21px;}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:0.01em;}
.nav-badge{
  position:absolute;
  top:0px;
  inset-inline-end:22%;
  min-width:15px;
  height:15px;
  padding:0 3px;
  border-radius:999px;
  background:var(--rosewood-light);
  color:var(--cream);
  font-size:9px;
  font-weight:800;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--obsidian);
}

/* ============================================================
   CART SCREEN
   ============================================================ */
.screen-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:calc(16px + var(--safe-top)) 18px 16px;
  border-bottom:1px solid var(--hairline);
  position:sticky;top:0;z-index:20;
  background:rgba(10,9,8,0.96);
  backdrop-filter:blur(16px);
}
.screen-title{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:600;
}
.cart-item{
  display:flex;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--hairline);
}
.cart-item-img{
  width:64px;height:64px;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  flex:0 0 auto;

function crop(url, seed){
  // varies the visible crop slightly per-product so the same source photo
  // reads as a distinct product tile within a category grid
  const positions=["center","top","bottom","left","right"];
  const p=positions[seed % positions.length];
  return url.replace("fit=crop", "fit=crop&crop="+p);
}

/* ============================================================
   HELPERS
   ============================================================ */
function fmt(n){ return n.toLocaleString(State.lang==="ar" ? "ar-DZ" : (State.lang==="fr"?"fr-FR":"en-US")); }

function isStoreOpen(store){
  const now = new Date();
  const h = now.getHours() + now.getMinutes()/60;
  if(store.openHour < store.closeHour){
    return h >= store.openHour && h < store.closeHour;
  }
  return h >= store.openHour || h < store.closeHour;
}

function getStore(id){ return STORES.find(s=>s.id===id); }
function getProductsByStore(id){ return PRODUCTS.filter(p=>p.storeId===id); }

function cartTotalCount(){ return State.cart.reduce((sum,i)=>sum+i.qty,0); }
function cartSubtotal(){
  return State.cart.reduce((sum,i)=>{
    const p = PRODUCTS.find(pp=>pp.id===i.productId);
    return sum + (p ? p.price*i.qty : 0);
  },0);
}
const DELIVERY_FEE = 200;

function cartStoreIds(){
  return [...new Set(State.cart.map(i=>{
    const p = PRODUCTS.find(pp=>pp.id===i.productId);
    return p ? p.storeId : null;
  }).filter(Boolean))];
}

function addToCart(productId){
  const existing = State.cart.find(i=>i.productId===productId);
  if(existing){ existing.qty += 1; }
  else{ State.cart.push({productId, qty:1}); }
  saveCart();
  renderCartBadges();
  showToast(t("addedToCart"));
}
function decrementCart(productId){
  const existing = State.cart.find(i=>i.productId===productId);
  if(!existing) return;
  existing.qty -= 1;
  if(existing.qty <= 0){
    State.cart = State.cart.filter(i=>i.productId!==productId);
  }
  saveCart();
  renderCartBadges();
}
function removeFromCart(productId){
  State.cart = State.cart.filter(i=>i.productId!==productId);
  saveCart();
  renderCartBadges();
  render();
}
function qtyInCart(productId){
  const item = State.cart.find(i=>i.productId===productId);
  return item ? item.qty : 0;
}

let toastTimer = null;
function showToast(msg){
  const toast = document.getElementById("toast");
  document.getElementById("toastText").textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"), 2200);
}

function filterStores(){
  let list = STORES;
  if(State.activeCategory !== "all"){
    list = list.filter(s=>s.category===State.activeCategory);
  }
  if(State.searchQuery.trim()){
    const q = State.searchQuery.trim().toLowerCase();
    const matchingStoreIds = new Set(
      PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)).map(p=>p.storeId)
    );
    list = list.filter(s=> s.name.toLowerCase().includes(q) || matchingStoreIds.has(s.id));
  }
  return list;
}

          ${State.user.phone ? `<span class="verified-badge">${ICONS.check.replace('width="34" height="34"','width="13" height="13"')} ${t("verifiedPhone")}</span>` : ""}
        </div>
      </div>

      <div class="section" style="padding-top:18px;">
        <div class="section-head"><div class="section-title" style="font-size:17px;">${t("myOrders")}</div></div>
        ${orders.length===0 ? `
          <div class="empty-state" style="padding:30px 20px;">
            <div class="empty-title" style="font-size:15px;">${t("noOrdersYet")}</div>
            <div class="empty-text">${t("noOrdersText")}</div>
          </div>
        ` : orders.map(o=>`
          <div class="order-card">
            <div class="order-card-top">
              <div class="order-id">#${o.orderId}</div>
              <div class="order-date">${o.date}</div>
            </div>
            <div class="order-items-text">${o.itemsSummary}</div>
            <div class="order-total"><span>${t("total")}</span><span>${fmt(o.total)} ${t("dzd")}</span></div>
          </div>
        `).join("")}
      </div>

      <div class="profile-menu">
        <div class="menu-row"><div class="menu-icon">${ICONS.mapPin2}</div><div class="menu-label">${t("savedAddresses")}</div><div class="menu-chevron">${ICONS.chevronRight}</div></div>
        <div class="menu-row"><div class="menu-icon">${ICONS.card}</div><div class="menu-label">${t("paymentMethods")}</div><div class="menu-chevron">${ICONS.chevronRight}</div></div>
        <div class="menu-row"><div class="menu-icon">${ICONS.heart}</div><div class="menu-label">${t("myFavourites")}</div><div class="menu-chevron">${ICONS.chevronRight}</div></div>
        <div class="menu-row"><div class="menu-icon">${ICONS.help}</div><div class="menu-label">${t("helpCenter")}</div><div class="menu-chevron">${ICONS.chevronRight}</div></div>
        <div class="menu-row logout-row" data-action="logout" style="cursor:pointer;">
          <div class="menu-icon">${ICONS.logout}</div><div class="menu-label">${t("logout")}</div>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  renderHeaderChrome();
  const main = document.getElementById("appMain");
  let html = "";
  switch(State.route){
    case "home": html = renderHome(); break;
    case "stores": html = renderStores(); break;
    case "store": html = renderStoreDetail(); break;
    case "cart": html = renderCart(); break;
    case "notifications": html = renderNotifications(); break;
    case "profile": html = renderProfile(); break;
    default: html = renderHome();
  }
  main.innerHTML = html;
  renderNavActiveState();
  renderCartBadges();
  window.scrollTo(0,0);
}

function renderNavActiveState(){
  document.querySelectorAll(".nav-item").forEach(el=>{
    el.classList.toggle("active", el.dataset.route === State.route);
  });
}

function renderCartBadges(){
  const count = cartTotalCount();
  const badge = document.getElementById("navCartBadge");
  badge.textContent = count;
  badge.classList.toggle("hide", count===0);

  const notifBadge = document.getElementById("navNotifBadge");
  const unread = State.notifications.length;
  notifBadge.textContent = unread;
  notifBadge.classList.toggle("hide", unread===0);

  const fc = document.getElementById("floatingCart");
  const showFc = count > 0 && (State.route==="home" || State.route==="stores" || State.route==="store");
  fc.classList.toggle("hidden", !showFc);
  document.getElementById("fcCount").textContent = count;
  document.getElementById("fcSub").textContent = fmt(cartSubtotal()) + " " + t("dzd");
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goTo(route){
  State.route = route;
  render();
}

/* ============================================================
   AUTH MODAL LOGIC
   ============================================================ */
function openAuthModal(pendingAction){
  State.pendingAction = pendingAction || null;
  document.getElementById("authModal").classList.add("show");
  document.getElementById("authError").style.display = "none";
}
function closeModal(id){
  document.getElementById(id).classList.remove("show");
}

function setAuthTab(tabName){
  State.authTab = tabName;
  document.querySelectorAll('[data-action="auth-tab"]').forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === tabName);
  });
  const submitBtn = document.getElementById("authSubmitBtn");
  submitBtn.textContent = tabName==="signin" ? t("signIn") : t("createAccount");
}

function togglePasswordVisibility(){
  const input = document.getElementById("authPassword");
  State.passwordVisible = !State.passwordVisible;
  input.type = State.passwordVisible ? "text" : "password";
  document.getElementById("eyeIcon").innerHTML = State.passwordVisible
    ? '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3" stroke="currentColor" stroke-width="2"/>'
    : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
}

function completeSignIn(name, email, avatarSeed){
  State.user = {
    name: name,
    email: email,
    phone: (State.user && State.user.phone) || "",
    signedInAt: new Date().toISOString()
  };
  saveUser();
  closeModal("authModal");
  showToast(t("signedIn"));
  if(State.pendingAction === "checkout"){
    goTo("cart");
  } else if(State.pendingAction === "profile"){
    goTo("profile");
  } else {
    render();
  }
  State.pendingAction = null;
}

function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const errorEl = document.getElementById("authError");
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!emailValid || password.length < 6){
    errorEl.style.display = "block";
    return;
  }
  errorEl.style.display = "none";
  const name = email.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g, c=>c.toUpperCase());
  completeSignIn(name, email);
}

function handleGoogleSignIn(){
  const btn = document.getElementById("googleBtn");
  const btnText = document.getElementById("googleBtnText");
  btn.classList.add("loading");
  const originalText = btnText.textContent;
  btnText.textContent = "...";
  setTimeout(()=>{
    btn.classList.remove("loading");
    btnText.textContent = originalText;
    completeSignIn("Amina Belkacem", "amina.belkacem@gmail.com");
  }, 950);
}

/* ============================================================
   ORDER PLACEMENT
   ============================================================ */
function placeOrder(){
  const phoneInput = document.getElementById("checkoutPhone");
  const phone = phoneInput ? phoneInput.value.trim() : "";

  if(!State.user){
    openAuthModal("checkout");
    return;
  }
  if(!phone || phone.length < 8){
    phoneInput.style.borderColor = "var(--danger)";
    phoneInput.focus();
    return;
  }

  State.user.phone = phone;
  saveUser();

  const subtotal = cartSubtotal();
  const total = subtotal + DELIVERY_FEE;
  const orderId = "ME" + Date.now().toString().slice(-8);
  const itemsDetailed = State.cart.map(item=>{
    const p = PRODUCTS.find(pp=>pp.id===item.productId);
    return { productId:item.productId, name:p ? p.name : "", qty:item.qty, price:p ? p.price : 0, storeId:p ? p.storeId : "" };
  });
  const itemsSummary = itemsDetailed.map(i=>`${i.qty}x ${i.name}`).join(", ");

  const order = {
    orderId,
    userEmail: State.user.email,
    userName: State.user.name,
    phone,
    items: itemsDetailed,
    subtotal,
    deliveryFee: DELIVERY_FEE,
    total,
    date: new Date().toLocaleString(State.lang==="ar" ? "ar-DZ" : (State.lang==="fr"?"fr-FR":"en-US")),
    timestamp: Date.now(),
    itemsSummary
  };

  const allOrders = JSON.parse(localStorage.getItem("me_orders") || "[]");
  allOrders.push(order);
  localStorage.setItem("me_orders", JSON.stringify(allOrders));

  State.notifications.unshift({
    id:"n"+Date.now(), type:"order", titleKey:"notifOrderTitle", textKey:"notifOrderText", time: t("dzd")==="دج" ? "الآن" : "now"
  });
  saveNotifs();

  State.cart = [];
  saveCart();

  showOrderSuccess(order);
}

function showOrderSuccess(order){
  const main = document.getElementById("appMain");
  main.innerHTML = `
    <div class="order-success fade-in">
      <div class="success-ring">${ICONS.check}</div>
      <div class="modal-title" style="text-align:center;">${t("orderConfirmed")}</div>
      <p class="modal-sub" style="text-align:center;">${t("orderConfirmedText")}</p>
      <div class="summary-block" style="text-align:${State.lang==='ar'?'right':'left'};">
        <div class="summary-row"><span>${t("total")}</span><span>${fmt(order.total)} ${t("dzd")}</span></div>
        <div class="summary-row"><span>#</span><span>${order.orderId}</span></div>
      </div>
      <div style="padding:0 18px;">
        <button class="btn-primary" data-action="nav" data-route="home">${t("backToHome")}</button>
      </div>
    </div>
  `;
  document.getElementById("topHeader").classList.add("hide");
  document.getElementById("floatingCart").classList.add("hidden");
  State.route = "order-success";
  renderNavActiveState();
  renderCartBadges();
}

/* ============================================================
   BANNER AUTOPLAY
   ============================================================ */
let bannerTimer = null;
function startBannerAutoplay(){
  clearInterval(bannerTimer);
  bannerTimer = setInterval(()=>{
    if(State.route !== "home") return;
    State.bannerIndex = (State.bannerIndex + 1) % BANNERS.length;
    const track = document.getElementById("bannerTrack");
    if(track){
      const dir = State.lang==="ar" ? 1 : -1;
      track.style.transform = `translateX(${dir*State.bannerIndex*100}%)`;
      document.querySelectorAll(".banner-dot").forEach((d,i)=>d.classList.toggle("active", i===State.bannerIndex));
    }
  }, 4200);
}

/* ============================================================
   LANGUAGE SWITCHING
   ============================================================ */
function applyLanguage(lang){
  State.lang = lang;
  localStorage.setItem("me_lang", lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.body.classList.toggle("lang-ar", lang==="ar");
  document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.lang===lang);
  });
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    el.setAttribute("placeholder", t(el.dataset.i18nPlaceholder));
  });
  setAuthTab(State.authTab);
  render();
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case "nav": {
      const route = el.dataset.route;
      if((route==="cart") ){
        goTo("cart");
      } else if(route==="profile"){
        goTo("profile");
      } else {
        goTo(route);
      }
      break;
    }
    case "go-cart": goTo("cart"); break;
    case "set-category": {
      State.activeCategory = el.dataset.cat;
      goTo(State.route==="home" ? "stores" : State.route);
      break;
    }
    case "quick-category": {
      State.activeCategory = el.dataset.cat;
      goTo("stores");
      break;
    }
    case "open-store": {
      State.activeStoreId = el.dataset.store;
      goTo("store");
      break;
    }
    case "add-cart": {
      addToCart(el.dataset.product);
      render();
      break;
    }
    case "dec-cart": {
      decrementCart(el.dataset.product);
      render();
      break;
    }
    case "remove-cart": {
      removeFromCart(el.dataset.product);
      break;
    }
    case "require-auth": {
      openAuthModal("profile");
      break;
    }
    case "place-order": {
      placeOrder();
      break;
    }
    case "logout": {
      State.user = null;
      localStorage.removeItem("me_user");
      showToast(t("signedOut"));
      render();
      break;
    }
    case "close-modal": {
      closeModal(el.dataset.modal);
      break;
    }
    case "auth-tab": {
      setAuthTab(el.dataset.tab);
      break;
    }
    case "toggle-password": {
      togglePasswordVisibility();
      break;
    }
    case "google-signin": {
      handleGoogleSignIn();
      break;
    }
    case "open-location": {
      // Lightweight, non-blocking location display — cycles through preset delivery zones
      const zones = ["Algiers — Hydra","Algiers — Kouba","Algiers — Bab Ezzouar","Algiers — Cheraga"];
      const current = document.getElementById("locationName").textContent;
      const idx = zones.indexOf(current);
      document.getElementById("locationName").textContent = zones[(idx+1) % zones.length];
      break;
    }
  }

  // Close modal by clicking overlay background
  if(e.target.classList.contains("modal-overlay")){
    e.target.classList.remove("show");
  }
});

document.getElementById("authForm").addEventListener("submit", handleAuthSubmit);

document.getElementById("langSwitch").addEventListener("click", function(e){
  const btn = e.target.closest(".lang-btn");
  if(!btn) return;
  applyLanguage(btn.dataset.lang);
});

document.getElementById("searchInput").addEventListener("input", function(e){
  State.searchQuery = e.target.value;
  if(State.route==="home"){
    render();
  } else if(State.route==="stores"){
    render();
  }
});

/* Cart checkout also requires auth: intercept floating cart if needed on cart screen */
document.getElementById("appMain").addEventListener("click", function(e){
  const btn = e.target.closest('[data-action="place-order"]');
  if(btn && !State.user){
    // handled inside placeOrder() via openAuthModal
  }
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  applyLanguage(State.lang);
  startBannerAutoplay();
  render();
}
init();
</script>
