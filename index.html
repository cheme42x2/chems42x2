<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxe Beauty Guelma</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050505;
            --bg-card: #111111;
            --bg-glass: rgba(20, 20, 20, 0.7);
            --accent-gold: #d4af37;
            --accent-rose: #8a3345;
            --text-primary: #ffffff;
            --text-secondary: #a9a9a9;
            --success: #2e8b57;
            --border-glow: rgba(212, 175, 55, 0.15);
            --shadow-lux: 0 10px 40px rgba(0, 0, 0, 0.8);
            --nav-height: 75px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #000;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-deep) 0%, #0a0a0a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lux);
        }

        .hidden { display: none !important; }

        header {
            padding: 20px 20px 10px;
            background: linear-gradient(to bottom, rgba(5,5,5,0.98) 70%, transparent);
            z-index: 10;
            position: absolute;
            top: 0;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .location-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .location-icon {
            color: var(--accent-gold);
            font-size: 1.4rem;
        }

        .location-text {
            display: flex;
            flex-direction: column;
        }

        .location-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .location-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .search-container {
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .search-container input:focus { border-color: var(--accent-gold); }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
        }

        .dhikr-banner {
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            border-top: 1px solid var(--border-glow);
            border-bottom: 1px solid var(--border-glow);
            padding: 6px 0;
            margin: 10px 0;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
        }

        .dhikr-text {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-gold);
            animation: scroll-left 20s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 135px 0 var(--nav-height) 0;
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        .section-header {
            padding: 0 20px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 900;
        }

        .stores-horizontal {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 0 20px 15px;
            gap: 15px;
            scrollbar-width: none;
        }
        .stores-horizontal::-webkit-scrollbar { display: none; }

        .store-card {
            min-width: 260px;
            max-width: 260px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            overflow: hidden;
            scroll-snap-align: start;
            cursor: pointer;
            flex-shrink: 0;
        }

        .store-cover {
            height: 140px;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .store-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 800;
            border: 1px solid;
        }
        
        .status-open { color: var(--success); border-color: var(--success); }
        .status-closed { color: var(--accent-rose); border-color: var(--accent-rose); }

        .store-info {
            padding: 12px;
        }

        .store-name {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .store-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .store-rating { color: var(--accent-gold); font-weight: 700; }

        .delivery-pill {
            background: var(--bg-glass);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--accent-gold);
            border: 1px solid var(--border-glow);
            display: inline-block;
        }

        /* Store View - Vertical Products */
        #store-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            z-index: 20;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        #store-view.active { transform: translateY(0); }

        .store-view-header {
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
            flex-shrink: 0;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-glow);
            cursor: pointer;
            z-index: 2;
            color: var(--text-primary);
        }

        .store-view-details {
            position: absolute;
            bottom: 15px;
            right: 20px;
            left: 20px;
            z-index: 2;
        }

        .sv-title {
            font-size: 1.6rem;
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        .products-vertical {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding-bottom: 100px;
            scrollbar-width: none;
        }
        .products-vertical::-webkit-scrollbar { display: none; }

        .product-card-large {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-image-container {
            width: 100%;
            height: 200px;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info-large {
            padding: 15px;
        }

        .product-title-large {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .product-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .product-price-large {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .add-to-cart-btn {
            background: var(--accent-rose);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 30;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            position: relative;
        }

        .nav-item.active { color: var(--accent-gold); }
        .nav-icon { font-size: 1.2rem; }
        .nav-label { font-size: 0.7rem; font-weight: 700; }

        .cart-badge {
            position: absolute;
            top: -5px;
            left: -10px;
            background: var(--accent-rose);
            color: white;
            font-size: 0.6rem;
            font-weight: 900;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal Cart */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            z-index: 40;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .modal.active { transform: translateX(0); }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
        }

        .modal-title { font-size: 1.2rem; font-weight: 900; }
        .close-modal { font-size: 1.4rem; cursor: pointer; color: var(--text-secondary); }

        .cart-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-glow);
        }

        .cart-img {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
        }

        .cart-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .cart-name { font-size: 0.95rem; font-weight: 800; }
        .cart-price { font-size: 0.95rem; color: var(--accent-gold); font-weight: 900; }
        
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-glass);
            padding: 4px 8px;
            border-radius: 8px;
            width: fit-content;
        }

        .qty-btn { background: transparent; border: none; color: var(--text-primary); font-size: 1rem; cursor: pointer; }

        .cart-summary {
            padding: 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-glow);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-glow);
            font-size: 1.2rem;
            font-weight: 900;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-gold);
            color: var(--bg-deep);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 900;
            margin-top: 15px;
            cursor: pointer;
        }

        #order-form {
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-glow);
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 50;
        }

        .styled-input {
            width: 100%;
            padding: 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .empty-cart { text-align: center; color: var(--text-secondary); margin-top: 40px; font-size: 1.1rem; }
    </style>
</head>
<body>

<div id="app-container">
    
    <header>
        <div class="top-bar">
            <div class="location-box">
                <i class="fa-solid fa-location-dot location-icon"></i>
                <div class="location-text">
                    <span class="location-label">التوصيل إلى</span>
                    <span class="location-title">قالمة، الجزائر</span>
                </div>
            </div>
            <i class="fa-regular fa-bell" style="font-size: 1.3rem;"></i>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="ابحث عن أفخم الماركات والمنتجات...">
        </div>
    </header>

    <main class="main-content" id="home-view">
        <div class="dhikr-banner">
            <span class="dhikr-text">اللهم صل وسلم على نبينا محمد وعلى آله وصحبه أجمعين • سبحان الله وبحمده سبحان الله العظيم •</span>
        </div>

        <div class="section-header">
            <h2 class="section-title">أفخم المتاجر</h2>
        </div>
        
        <div class="stores-horizontal" id="stores-list"></div>
        <div style="height: 20px;"></div>
    </main>

    <div id="store-view">
        <div class="store-view-header" id="sv-cover">
            <div class="back-btn" id="close-store"><i class="fa-solid fa-arrow-right"></i></div>
            <div class="store-view-details">
                <h1 class="sv-title" id="sv-name">اسم المتجر</h1>
            </div>
        </div>
        <div class="products-vertical" id="products-list"></div>
    </div>

    <div class="modal" id="cart-modal">
        <div class="modal-header">
            <h2 class="modal-title">سلة المشتريات</h2>
            <i class="fa-solid fa-xmark close-modal" id="close-cart"></i>
        </div>
        <div class="cart-scroll" id="cart-items-container"></div>
        <div class="cart-summary" id="cart-summary-box">
            <div class="summary-row">
                <span>المجموع الفرعي</span>
                <span id="cart-subtotal">0 د.ج</span>
            </div>
            <div class="summary-row">
                <span>رسوم التوصيل</span>
                <span>200 د.ج</span>
            </div>
            <div class="summary-total">
                <span>المجموع الكلي</span>
                <span id="cart-total">0 د.ج</span>
            </div>
            <button class="main-btn" id="btn-checkout">تأكيد الطلب والدفع</button>
        </div>

        <div id="order-form">
            <h3 style="margin-bottom: 5px;">إتمام الطلب</h3>
            <input type="tel" id="user-phone" class="styled-input" placeholder="رقم الهاتف (مثال: 0555...)">
            <button class="main-btn" style="margin-top: 5px;" id="btn-submit-order">إرسال الطلب للمتجر</button>
            <button class="main-btn" style="background: transparent; color: var(--text-secondary); border: 1px solid var(--text-secondary); margin-top: 5px;" id="btn-cancel-order">إلغاء</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home">
            <i class="fa-solid fa-house nav-icon"></i>
            <span class="nav-label">الرئيسية</span>
        </div>
        <div class="nav-item" id="nav-offers">
            <i class="fa-solid fa-tags nav-icon"></i>
            <span class="nav-label">العروض</span>
        </div>
        <div class="nav-item" id="nav-cart">
            <div class="cart-badge hidden" id="cart-badge-count">0</div>
            <i class="fa-solid fa-bag-shopping nav-icon"></i>
            <span class="nav-label">السلة</span>
        </div>
        <div class="nav-item" id="nav-profile">
            <i class="fa-solid fa-user nav-icon"></i>
            <span class="nav-label">حسابي</span>
        </div>
    </nav>
</div>

<script>
const storeData = [
    { id: 1, name: "بوتيك العيون الملكية", rating: "4.9", cover: "https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=800&q=80", open: true, tags: "باليت، ظلال" },
    { id: 2, name: "قصر الشفاه المخملية", rating: "4.8", cover: "https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=800&q=80", open: true, tags: "مات، جلوس" },
    { id: 3, name: "تغطية مثالية الأساس", rating: "4.7", cover: "https://images.unsplash.com/photo-1599305090598-fe179d501227?auto=format&fit=crop&w=800&q=80", open: true, tags: "كريم أساس" },
    { id: 4, name: "رموش وخطوط المحترفين", rating: "4.9", cover: "https://images.unsplash.com/photo-1631214500515-873b5eb5a1a7?auto=format&fit=crop&w=800&q=80", open: false, tags: "ماسكارا" },
    { id: 5, name: "أدوات التجميل الفاخرة", rating: "4.6", cover: "https://images.unsplash.com/photo-1590156546946-cb5afb12361b?auto=format&fit=crop&w=800&q=80", open: true, tags: "فرش" },
    { id: 6, name: "عناية وتحضير البشرة", rating: "4.8", cover: "https://images.unsplash.com/photo-1617897903246-719242758050?auto=format&fit=crop&w=800&q=80", open: true, tags: "برايمر" }
];

const productDetails = {
    1: [
        { name: "باليت الألوان الترابية", img: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=600&q=80" },
        { name: "ظلال العيون الذهبية", img: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=600&q=80" },
        { name: "مجموعة السموكي الفاخرة", img: "https://images.unsplash.com/photo-1571781926291-c477ebfd024b?auto=format&fit=crop&w=600&q=80" },
        { name: "باليت الألماس اللامع", img: "https://images.unsplash.com/photo-1583241793484-bc42d6313fbb?auto=format&fit=crop&w=600&q=80" }
    ],
    2: [
        { name: "أحمر شفاه قرمزي مات", img: "https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=600&q=80" },
        { name: "جلوس وردي لامع", img: "https://images.unsplash.com/photo-1631729371254-42c2892f0e6e?auto=format&fit=crop&w=600&q=80" },
        { name: "تنت الشفاه الطبيعي", img: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=600&q=80" }
    ],
    3: [
        { name: "كريم أساس سيلك الفاخر", img: "https://images.unsplash.com/photo-1599305090598-fe179d501227?auto=format&fit=crop&w=600&q=80" },
        { name: "كونسيلر التغطية الكاملة", img: "https://images.unsplash.com/photo-1526947425960-945c6e72858f?auto=format&fit=crop&w=600&q=80" }
    ],
    4: [
        { name: "ماسكارا الكثافة المضاعفة", img: "https://images.unsplash.com/photo-1631214500515-873b5eb5a1a7?auto=format&fit=crop&w=600&q=80" },
        { name: "آيلاينر جل مقاوم للماء", img: "https://images.unsplash.com/photo-1512290900672-8cb3c2a67bc4?auto=format&fit=crop&w=600&q=80" }
    ],
    5: [
        { name: "طقم فرش احترافي كامل", img: "https://images.unsplash.com/photo-1590156546946-cb5afb12361b?auto=format&fit=crop&w=600&q=80" },
        { name: "إسفنجة دمج ناعمة", img: "https://images.unsplash.com/photo-1563178406-4cdc2923acbc?auto=format&fit=crop&w=600&q=80" }
    ],
    6: [
        { name: "سيروم فيتامين سي", img: "https://images.unsplash.com/photo-1617897903246-719242758050?auto=format&fit=crop&w=600&q=80" },
        { name: "برايمر الذهب عيار 24", img: "https://images.unsplash.com/photo-1608248597359-f5383796d193?auto=format&fit=crop&w=600&q=80" }
    ]
};

let productsData = [];
storeData.forEach(store => {
    const items = productDetails[store.id];
    items.forEach((item, idx) => {
        productsData.push({
            id: parseInt(`${store.id}0${idx}`),
            storeId: store.id,
            name: item.name,
            price: Math.floor(Math.random() * 20 + 10) * 100,
            image: item.img
        });
    });
});

let cart = [];
const deliveryFee = 200;

function init() {
    renderStores();
    bindEvents();
}

function renderStores() {
    const list = document.getElementById('stores-list');
    list.innerHTML = '';
    
    storeData.forEach(store => {
        const statusClass = store.open ? 'status-open' : 'status-closed';
        const statusText = store.open ? 'مفتوح' : 'مغلق';
        
        const card = document.createElement('div');
        card.className = 'store-card';
        card.onclick = () => openStore(store.id);
        
        card.innerHTML = `
            <div class="store-cover" style="background-image: url('${store.cover}')">
                <div class="store-status ${statusClass}">${statusText}</div>
            </div>
            <div class="store-info">
                <div class="store-name">${store.name}</div>
                <div class="store-meta">
                    <span>${store.tags}</span>
                    <span class="store-rating"><i class="fa-solid fa-star"></i> ${store.rating}</span>
                </div>
                <div class="delivery-pill"><i class="fa-solid fa-motorcycle"></i> التوصيل: 200 د.ج</div>
            </div>
        `;
        list.appendChild(card);
    });
}

function openStore(id) {
    const store = storeData.find(s => s.id === id);
    if (!store) return;
    
    document.getElementById('sv-name').textContent = store.name;
    document.getElementById('sv-cover').style.backgroundImage = `url('${store.cover}')`;
    
    const sProducts = productsData.filter(p => p.storeId === id);
    const pList = document.getElementById('products-list');
    pList.innerHTML = '';
    
    sProducts.forEach(prod => {
        const pCard = document.createElement('div');
        pCard.className = 'product-card-large';
        pCard.innerHTML = `
            <div class="product-image-container">
                <img src="${prod.image}" alt="${prod.name}" loading="lazy">
            </div>
            <div class="product-info-large">
                <h3 class="product-title-large">${prod.name}</h3>
                <div class="product-action-row">
                    <span class="product-price-large">${prod.price} د.ج</span>
                    <button class="add-to-cart-btn" onclick="addToCart(${prod.id}, event)">
                        <i class="fa-solid fa-cart-plus"></i> إضافة
                    </button>
                </div>
            </div>
        `;
        pList.appendChild(pCard);
    });
    
    document.getElementById('store-view').classList.add('active');
}

function addToCart(productId, e) {
    e.stopPropagation();
    const product = productsData.find(p => p.id === productId);
    const existing = cart.find(i => i.product.id === productId);
    
    if (existing) { existing.quantity += 1; } 
    else { cart.push({ product, quantity: 1 }); }
    
    updateBadge();
    
    const btn = e.currentTarget;
    const ogHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-check"></i> تمت';
    btn.style.background = 'var(--success)';
    setTimeout(() => {
        btn.innerHTML = ogHtml;
        btn.style.background = '';
    }, 1000);
}

function updateBadge() {
    const badge = document.getElementById('cart-badge-count');
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    if (total > 0) {
        badge.textContent = total;
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
}

function renderCart() {
    const container = document.getElementById('cart-items-container');
    const summaryBox = document.getElementById('cart-summary-box');
    container.innerHTML = '';
    
    if (cart.length === 0) {
        container.innerHTML = `<div class="empty-cart">سلة المشتريات فارغة</div>`;
        summaryBox.style.display = 'none';
        return;
    }
    
    summaryBox.style.display = 'block';
    let subtotal = 0;
    
    cart.forEach((item, index) => {
        subtotal += item.product.price * item.quantity;
        const cItem = document.createElement('div');
        cItem.className = 'cart-item';
        cItem.innerHTML = `
            <img src="${item.product.image}" class="cart-img" alt="${item.product.name}">
            <div class="cart-info">
                <div class="cart-name">${item.product.name}</div>
                <div class="cart-price">${item.product.price} د.ج</div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                    <span style="font-weight: 850; width: 18px; text-align: center;">${item.quantity}</span>
                    <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                </div>
            </div>
        `;
        container.appendChild(cItem);
    });
    
    document.getElementById('cart-subtotal').textContent = `${subtotal} د.ج`;
    document.getElementById('cart-total').textContent = `${subtotal + deliveryFee} د.ج`;
}

function updateQty(index, change) {
    cart[index].quantity += change;
    if (cart[index].quantity <= 0) cart.splice(index, 1);
    renderCart();
    updateBadge();
}

function bindEvents() {
    document.getElementById('close-store').addEventListener('click', () => {
        document.getElementById('store-view').classList.remove('active');
    });

    const navs = document.querySelectorAll('.nav-item');
    navs.forEach(nav => {
        nav.addEventListener('click', (e) => {
            navs.forEach(n => n.classList.remove('active'));
            e.currentTarget.classList.add('active');
            
            const id = e.currentTarget.id;
            if (id === 'nav-home') {
                document.getElementById('store-view').classList.remove('active');
                document.getElementById('cart-modal').classList.remove('active');
            } else if (id === 'nav-cart') {
                renderCart();
                document.getElementById('cart-modal').classList.add('active');
            }
        });
    });

    document.getElementById('close-cart').addEventListener('click', () => {
        document.getElementById('cart-modal').classList.remove('active');
        document.getElementById('nav-home').click();
    });

    document.getElementById('btn-checkout').addEventListener('click', () => {
        document.getElementById('order-form').style.display = 'flex';
    });

    document.getElementById('btn-cancel-order').addEventListener('click', () => {
        document.getElementById('order-form').style.display = 'none';
    });

    document.getElementById('btn-submit-order').addEventListener('click', () => {
        const phone = document.getElementById('user-phone').value;
        if (!phone || phone.length < 9) {
            alert("يرجى إدخال رقم هاتف صحيح");
            return;
        }
        
        const subtotal = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
        const orderPayload = {
            phone: phone,
            items: cart,
            total: subtotal + deliveryFee,
            date: new Date().toISOString()
        };
        
        const orders = JSON.parse(localStorage.getItem('guelma_makeup_orders') || '[]');
        orders.push(orderPayload);
        localStorage.setItem('guelma_makeup_orders', JSON.stringify(orders));
        
        alert("تم إرسال طلبك بنجاح!");
        cart = [];
        updateBadge();
        document.getElementById('order-form').style.display = 'none';
        document.getElementById('close-cart').click();
    });
}

init();
</script>
</body>
</html>
